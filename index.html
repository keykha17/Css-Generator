<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Generator Kode CSS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Lora:wght@400..700&family=Montserrat:wght@100..900&family=Playfair+Display:wght@400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap">
<style>
:root{
  /* Tata letak: kontrol bertab di kiri; pratinjau + kode menempel di kanan. Di ponsel pratinjau menempel di atas. */
  --bg:#eff2f8; --surface:#ffffff; --fg:#141a31; --muted:#586082; --line:#dbe0ee;
  --accent:#3447c9; --accent-fg:#ffffff; --accent-soft:#e6e9fb;
  --ok:#0f7a4a; --bad:#b4233a;
  --code-bg:#11152a; --code-fg:#d9e0ff; --code-prop:#8fb2ff; --code-val:#ffcf99; --code-line:#2a3157;
  --chk-a:#f7f8fc; --chk-b:#e8ebf4;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e1d; --surface:#151a30; --fg:#e8ebf8; --muted:#9aa3c7; --line:#2a3050;
    --accent:#8ea0ff; --accent-fg:#0b0e1d; --accent-soft:#222a55;
    --ok:#58d39b; --bad:#ff8aa0;
    --code-bg:#0a0d1c; --code-fg:#d9e0ff; --code-prop:#8fb2ff; --code-val:#ffcf99; --code-line:#2a3157;
    --chk-a:#1a1f38; --chk-b:#222846;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e1d; --surface:#151a30; --fg:#e8ebf8; --muted:#9aa3c7; --line:#2a3050;
  --accent:#8ea0ff; --accent-fg:#0b0e1d; --accent-soft:#222a55;
  --ok:#58d39b; --bad:#ff8aa0;
  --code-bg:#0a0d1c; --code-fg:#d9e0ff; --code-prop:#8fb2ff; --code-val:#ffcf99; --code-line:#2a3157;
  --chk-a:#1a1f38; --chk-b:#222846;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.4rem;line-height:1.2;margin:0;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.right{display:contents}
.preview{order:1;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 12px 12px}
.controls{order:2}
.code{order:3}
@media (min-width:960px){
  .layout{grid-template-columns:minmax(0,var(--a,1fr)) minmax(0,var(--b,1fr));align-items:start}
  .right{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);min-width:0}
  .preview,.controls,.code{order:0}
  .preview{position:static;flex:none;padding:14px 16px 16px}
  .code{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .code-body{overflow:auto;min-height:120px}
}

/* tombol & isian */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;font-weight:600;font-size:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.field,select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 9px;font-size:13px;min-width:0;width:100%}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;flex:none}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
input.num{width:72px;flex:none;padding:4px 6px;font:500 12px var(--f-mono);text-align:right}
.hex{font-family:var(--f-mono);text-transform:lowercase}

/* pratinjau */
.pv-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pv-head h2,.code-head h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.01em}
/* ponsel tegak dengan layar 360x740 piksel CSS sungguhan, diperkecil (--k) agar muat */
.phone{--k:.4;position:relative;margin:0 auto;width:max-content;background:linear-gradient(145deg,#2a2f4a,#0b0d18 40%,#1c2038);border-radius:calc(34px*var(--k) + 14px);padding:7px;box-shadow:0 0 0 1.5px #3a4066,0 14px 30px rgba(10,14,40,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone::before{content:"";position:absolute;right:-3px;top:22%;width:3px;height:14%;background:#2b3050;border-radius:0 3px 3px 0}
.phone::after{content:"";position:absolute;left:-3px;top:18%;width:3px;height:8%;background:#2b3050;border-radius:3px 0 0 3px;box-shadow:0 calc(60px*var(--k)) 0 #2b3050}
.vp{position:relative;overflow:hidden;border-radius:calc(34px*var(--k));background:#000;width:calc(var(--sw,360px)*var(--k));height:calc(var(--sh,740px)*var(--k));isolation:isolate}
.screen{position:absolute;left:0;top:0;width:var(--sw,360px);height:var(--sh,740px);transform:scale(var(--k));transform-origin:0 0}
.stage{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;border:0;padding:52px 16px 34px;transform:translateZ(0)}
.island{position:absolute;top:10px;left:50%;width:96px;height:26px;margin-left:-48px;background:#05060c;border-radius:20px;z-index:3;pointer-events:none}
.sbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;color:#fff;mix-blend-mode:difference;font:700 14px var(--f-ui);z-index:3;pointer-events:none}
.sbar i{display:block;width:24px;height:11px;border:1.5px solid #fff;border-radius:4px;position:relative}
.sbar i::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:#fff;border-radius:1px}
.hbar{position:absolute;bottom:8px;left:50%;width:120px;height:5px;margin-left:-60px;background:#fff;mix-blend-mode:difference;border-radius:3px;z-index:3;pointer-events:none}
.nobars .island,.nobars .sbar,.nobars .hbar{display:none}
.el{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.el.dragging{transition:none!important}
.selbox{position:absolute;pointer-events:none;z-index:2;border:solid #3447c9;border-radius:2px;box-shadow:0 0 0 1px #fff;box-sizing:content-box;display:none}
.hint{display:none;margin:8px 0 0;text-align:center;color:var(--muted);font-size:12px}
@media (min-width:960px){.hint{display:block}}
.layers{display:grid;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chips,.lbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;font:600 12px var(--f-mono);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lbar select{width:auto;padding:5px 8px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.el.editing{user-select:text;-webkit-user-select:text;cursor:text;touch-action:auto;outline:2px solid #3447c9!important;outline-offset:2px!important}
.stb{position:absolute;display:flex;gap:4px;white-space:nowrap;pointer-events:auto;z-index:4}
.stb button{border:0;background:#141a31;color:#fff;border-radius:7px;padding:6px 10px;font:600 12px var(--f-ui);cursor:pointer;box-shadow:0 0 0 1px #fff}
.rsz{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;background:#fff;border:3px solid #3447c9;border-radius:50%;pointer-events:auto;cursor:nwse-resize;touch-action:none;z-index:4}
.selbox.noui .stb,.selbox.noui .rsz{display:none}
.pvtools{display:none;gap:6px}
/* mode layar penuh */
body.full{overflow:hidden;padding:0}
body.full header,body.full .code,body.full .hint,body.full .pv-head h2{display:none}
body.full .right{position:static;max-height:none;display:block}
body.full .preview{position:fixed;left:0;right:0;top:0;bottom:0;z-index:10;border:0;border-radius:0;background:var(--bg);padding:52px 0 0;box-sizing:border-box;display:grid;place-items:center}
body.full .pv-head{position:absolute;top:10px;left:12px;right:12px;margin:0;z-index:12;justify-content:space-between}
body.full .pvtools{display:flex}
body.full .controls{position:fixed;z-index:20;left:0;right:0;bottom:0;max-height:50vh;max-height:50dvh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(10,14,40,.28)}
body.full:not(.open) .controls .presets,body.full:not(.open) .controls .tabs,body.full:not(.open) .controls #panel{display:none}
body.full:not(.open) .chips{flex-wrap:nowrap;overflow-x:auto}
@media (min-width:960px){
  #panelBtn{display:none}
  body.full .preview{right:400px}
  body.full .controls{left:auto;top:0;width:400px;max-height:none;border-radius:0;box-shadow:-10px 0 30px rgba(10,14,40,.22)}
}
.stage.bg-kotak{background-color:var(--chk-a);background-image:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.stage.bg-putih{background:#ffffff}
.stage.bg-gelap{background:#0b0d17}
.stage.bg-warna{background:linear-gradient(135deg,#f97316 0%,#ec4899 45%,#3b82f6 100%)}
.blk .blk{margin:4px 0 4px 18px}
.ghost{flex:none;min-width:64px;min-height:44px;border:1.5px dashed #8a93b8;border-radius:6px;color:#8a93b8;font-size:11px;display:grid;place-items:center;padding:6px}

/* kontrol */
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.presets span{color:var(--muted);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px;scrollbar-width:thin}
.tabs button{border:0;background:none;white-space:nowrap;font-weight:600;font-size:13px;color:var(--muted);padding:11px 11px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
#panel{padding:16px}
.group{margin:0 0 22px;display:grid;gap:2px;min-width:0}
.group h3{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:grid;gap:6px;margin-bottom:12px;min-width:0}
.row>label,.top label{font-weight:600;font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.numwrap{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.colorline{display:flex;gap:8px;align-items:center}
.colorline .hex{width:110px}
.sizerow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.note{margin:0 0 12px;color:var(--muted);font-size:12.5px;max-width:62ch}
.layer{border:1px solid var(--line);border-radius:10px;padding:10px 12px 4px;margin:0 0 12px;min-width:0}
.layer legend{font-weight:700;font-size:12.5px;padding:0 6px}
.layer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.gbar{height:28px;border-radius:8px;border:1px solid var(--line);margin-bottom:12px}
.gp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.gp button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:4px;cursor:pointer;font-size:11px;font-weight:600;display:grid;gap:4px;justify-items:center;width:64px}
.gp i{display:block;width:100%;height:26px;border-radius:5px}
.stopwrap{margin-bottom:12px;min-width:0}
.stop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.stop .hex{width:96px}
.swbtn{flex:none;width:40px;height:40px;border-radius:50%;padding:4px;border:0;cursor:pointer;background:conic-gradient(#ff3b3b,#ffd23b,#3bff6a,#3bf0ff,#3b5bff,#d63bff,#ff3b3b)}
.swbtn i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--surface)}
.wpanel{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:2px;width:100%;max-width:280px}
.wpanelin{display:grid;gap:12px;justify-items:center}
.wheelbox{position:relative;width:min(240px,100%);aspect-ratio:1;touch-action:none}
.wheelbox canvas{width:100%;height:100%;display:block;border-radius:50%;cursor:crosshair;touch-action:none}
.mk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #ffffff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.vlab{display:grid;gap:6px;width:100%;font-size:12px;font-weight:600}
input[type=range].vs{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;background:linear-gradient(90deg,#000000,var(--vc,#ffffff));border:1px solid var(--line)}
input[type=range].vs::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#ffffff;border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range].vs::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#ffffff;border:3px solid var(--accent)}
.stop label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}

/* alat warna */
.conv{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.conv .k{font-weight:700;font-size:12px;color:var(--muted)}
.conv code{font:500 12.5px var(--f-mono);overflow-wrap:anywhere}
.harm{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 4px}
.harm h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.swrow{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:grid;gap:3px;justify-items:center;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font:500 10.5px var(--f-mono)}
.sw i{display:block;width:44px;height:36px;border-radius:7px;border:1px solid var(--line)}
.ratio{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:6px}
.ratio b{font:700 20px var(--f-mono);font-variant-numeric:tabular-nums}
.badge{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.no{color:var(--bad);border-color:var(--bad)}
.tools-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 4px}
.tools-head h4{margin:0;font-size:12.5px}

/* kode */
.code-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.cls{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.cls input{width:120px;font:500 12px var(--f-mono);padding:5px 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.code-body{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-mono);font-size:12.5px;line-height:1.55;padding:12px 14px;border-radius:0 0 12px 12px}
.blk{margin-bottom:12px}
.blk:last-child{margin-bottom:0}
.sel{font-weight:500}
.ln{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:2px 0 2px 18px}
.ln code{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.ln.cm{padding-left:0;margin-bottom:12px;color:#8a93b8}
.p{color:var(--code-prop)}
.v{color:var(--code-val)}
.cp{flex:none;background:transparent;border:1px solid var(--code-line);color:var(--code-prop);border-radius:6px;font:600 11px var(--f-ui);padding:2px 9px;cursor:pointer}
.cp:hover{border-color:var(--code-prop)}
.conv .cp{border-color:var(--line);color:var(--accent)}
.sr{position:fixed;left:-9999px;top:0;opacity:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ===== tampilan fleksibel ===== */
.tools{position:relative}
.pop{position:fixed;z-index:400;width:min(330px,calc(100vw - 16px));max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow:auto;padding:14px 16px;box-shadow:0 14px 40px rgba(10,14,40,.3)}
.pop h3{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.pop .row{margin-bottom:10px}
.pop .btn{width:100%}
.grip{display:none;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--accent-soft);color:var(--fg);border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-weight:700;font-size:12.5px;position:sticky;top:0;z-index:6;border-radius:12px 12px 0 0;flex:none}
.grip:active{cursor:grabbing}
.grip .gb{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;width:30px;height:26px;cursor:pointer;font:700 14px var(--f-ui);line-height:1;padding:0}
.win-rsz{display:none;position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;z-index:7;border-radius:0 0 12px 0;background:linear-gradient(135deg,transparent 48%,var(--muted) 48%,var(--muted) 56%,transparent 56%,transparent 68%,var(--muted) 68%,var(--muted) 76%,transparent 76%)}
body.free{overflow:hidden}
body.free .right{display:contents;position:static;max-height:none}
body.free .win{position:fixed;display:flex;flex-direction:column;margin:0;order:0;overflow:hidden;max-width:none;box-shadow:0 12px 36px rgba(10,14,40,.3)}
body.free .win .grip{display:flex}
body.free .win .win-rsz{display:block}
body.free .controls{display:block;overflow:auto}
body.free .preview{padding:0}
body.free .preview .pv-head{margin:8px 12px 0;flex:none}
body.free .preview .phone{margin:auto;flex:none}
body.free .hint{display:none}
body.free .code-body{flex:1;min-height:0;overflow:auto}
body.free .win.min>*:not(.grip){display:none!important}
body.free .win.min .win-rsz{display:none}
.pv-head{flex-wrap:wrap}
.pv-head h2{flex:1 1 auto}
.pv-head .seg{max-width:100%}
.phone.bare{background:none;box-shadow:none;padding:0}
.phone.bare::before,.phone.bare::after{display:none}
.phone.bare .vp{border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.phone.land .island,.phone.land .hbar{display:none}
body.full .grip .gb{display:none}
@media (max-width:959px){
  body.full .controls .grip{display:flex;border-radius:16px 16px 0 0}
  body.full:not(.open) .controls{height:auto!important;max-height:none!important}
}
@media (min-width:960px){
  body.pvleft .layout{grid-template-columns:minmax(0,var(--b,1fr)) minmax(0,var(--a,1fr))}
  body.pvleft .right{order:-1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Generator Kode CSS</h1>

function wheel(getHex,setHex){

    var img=ctx.createImageData(N,N),d=img.data,i=0;

function select(p,label,opts,re){
  var id=idOf(p);
  var s=h('select',{id:id},opts.map(function(o){var a=Array.isArray(o)?o:[o,o];return h('option',{value:a[0]},a[1]);}));
  s.value=get(p);
  s.addEventListener('change',function(){set(p,s.value);if(p.indexOf('scr.')===0)renderBg();if(re)renderControls();update();});
  return h('div',{class:'row'},h('label',{for:id},label),s);
}
function check(p,label,re){
  var id=idOf(p);
  var cb=h('input',{type:'checkbox',id:id,checked:get(p)});
  cb.addEventListener('change',function(){set(p,cb.checked);if(p.indexOf('scr.')===0)renderBg();if(re)renderControls();update();});
  return h('div',{class:'row'},h('label',{class:'chk',for:id},cb,label));
}
function text(p,label){
  var id=idOf(p);
  var t=h('input',{type:'text',id:id,value:get(p),maxlength:60});
  t.addEventListener('input',function(){set(p,t.value);update();});
  return h('div',{class:'row'},h('label',{for:id},label),t);
}
function size(p,label){
  var id=idOf(p),o=get(p);
  var v=h('input',{type:'number',id:id,min:0,step:1,value:o.v,disabled:o.u==='auto'});
  var u=h('select',{'aria-label':label+' (satuan)'},['px','%','rem','vw','vh','auto'].map(function(x){return h('option',{value:x},x);}));
  u.value=o.u;
  v.addEventListener('input',function(){if(v.value===''||isNaN(+v.value))return;o.v=Math.max(0,+v.value);update();});
  v.addEventListener('change',function(){v.value=o.v;});
  u.addEventListener('change',function(){o.u=u.value;v.disabled=o.u==='auto';update();});
  return h('div',{class:'row'},h('label',{for:id},label),h('div',{class:'sizerow'},v,u));
}
function box4(p,keys,names,min,max){
  var o=get(p),id=idOf(p)+'_link';
  var cb=h('input',{type:'checkbox',id:id,checked:o.link});
  cb.addEventListener('change',function(){
    o.link=cb.checked;
    keys.slice(1).forEach(function(k){o[k]=o[keys[0]];});
    renderControls();update();
  });
  var kids=[h('div',{class:'row'},h('label',{class:'chk',for:id},cb,'Sama untuk semua sisi'))];
  if(o.link)kids.push(range(p+'.'+keys[0],'Semua sisi',min,max,1,'px'));
  else keys.forEach(function(k,i){kids.push(range(p+'.'+k,names[i],min,max,1,'px'));});
  return kids;
}
function segBtns(box,opts,cur,on){
  box.replaceChildren.apply(box,opts.map(function(o){
    return h('button',{type:'button','aria-pressed':String(o[0]===cur),onclick:function(){on(o[0]);}},o[1]);
  }));
}

/* alat warna: konversi, kontras, harmoni */
function fillColorTools(){
  var box=$('#derived');if(!box)return;
  var key=S.cv,hex=key==='bg'?S.bg.c:S.fg,al=key==='bg'?S.bg.a:100;
  var seg=h('div',{class:'seg',role:'group','aria-label':'Warna yang dikonversi'});
  segBtns(seg,[['bg','Latar'],['fg','Teks']],key,function(v){S.cv=v;save();fillColorTools();});
  var rows=[['HEX',fmt(hex,al,'hex')],['RGB',fmt(hex,al,'rgb')],['HSL',fmt(hex,al,'hsl')]].map(function(r){
    return h('div',{class:'conv'},h('span',{class:'k'},r[0]),h('code',null,r[1]),
      h('button',{class:'cp',type:'button',onclick:function(){copy(r[1],'Tersalin: '+r[1]);}},'Salin'));
  });
  var q=rgbToHsl(hexToRgb(hex));
  function rot(dd){return hslToHex(q.h+dd,q.s,q.l);}
  var groups=[['Komplementer',[rot(180)]],['Analog',[rot(-30),rot(30)]],['Triadik',[rot(120),rot(240)]],['Gradasi terang ke gelap',[95,85,70,55,40,25].map(function(l){return hslToHex(q.h,q.s,l);})]];
  var harm=h('div',{class:'harm'},groups.map(function(g){
    return h('div',null,h('h4',null,g[0]),h('div',{class:'swrow'},g[1].map(function(x){
      var val=fmt(x,100);
      return h('button',{class:'sw',type:'button','aria-label':'Salin warna '+x,title:'Klik untuk menyalin',onclick:function(){copy(val,'Tersalin: '+val);}},
        h('i',{style:'background:'+x}),x);
    })));
  }));
  var bgc=S.gr.on?S.gr.stops[0].c:S.bg.c;
  var r=contrast(S.fg,bgc);
  var badges=[['AA teks biasa (4,5)',r>=4.5],['AA teks besar (3)',r>=3],['AAA (7)',r>=7]].map(function(b){
    return h('span',{class:'badge '+(b[1]?'ok':'no')},b[0]+': '+(b[1]?'lulus':'gagal'));
  });

    return h('div',{class:'row'},h('label',{class:'chk',for:id},cb,label));
  }
  var dev=h('select',{id:'v_dev'},DEVS.map(function(d){return h('option',{value:d[0]},d[1]);}));
  dev.value=UI.dev;
  dev.addEventListener('change',function(){UI.dev=dev.value;saveUI();applyDevice();fitPhone();});
  var side=h('div',{class:'seg',role:'group','aria-label':'Posisi pratinjau'});
  segBtns(side,[['kanan','Kanan'],['kiri','Kiri']],UI.side,function(v){UI.side=v;saveUI();applyLayout();renderView();});
  var sv=h('span',null,String(UI.split));
  var sl=h('input',{type:'range',id:'v_split',min:30,max:70,step:1,value:UI.split});
  sl.addEventListener('input',function(){UI.split=+sl.value;sv.textContent=sl.value;applyLayout();});
  sl.addEventListener('change',saveUI);
  fill(pop,[
    h('h3',null,'Susunan jendela'),
    chk('v_free','Jendela bebas: geser dan ubah ukuran pratinjau, pengaturan, dan kode',UI.free,function(v){UI.free=v;applyLayout();}),
    h('p',{class:'note'},'Di mode ini tiap jendela punya pegangan di atasnya. Seret pegangan untuk memindah, seret sudut kanan bawah untuk mengubah ukuran, tombol – untuk mengecilkan. Tombol panah juga bisa dipakai (Alt + panah mengubah ukuran).'),
    h('h3',null,'Susunan otomatis (layar lebar)'),
    h('div',{class:'row'},h('label',null,'Pratinjau berada di'),side),
    h('div',{class:'row'},h('div',{class:'top'},h('label',{for:'v_split'},'Lebar kolom pengaturan'),h('span',{class:'numwrap'},sv,'%')),sl),
    h('h3',null,'Layar pratinjau'),
    h('div',{class:'row'},h('label',{for:'v_dev'},'Ukuran layar'),dev),
    chk('v_land','Layar mendatar (landscape)',UI.land,function(v){UI.land=v;applyDevice();fitPhone();}),
    chk('v_frame','Tampilkan bingkai ponsel',UI.frame,function(v){UI.frame=v;applyDevice();fitPhone();}),
    h('div',{class:'row'},h('button',{class:'btn',type:'button',onclick:function(){
      UI.wins={};UI.sheetH=0;UI.side='kanan';UI.split=50;saveUI();applyLayout();renderView();toast('Tata letak diatur ulang');
    }},'Atur ulang tata letak'))
  ]);
}
function initView(){
  var btn=$('#viewBtn'),pop=$('#viewPanel');
  function close(){if(!pop.hidden){pop.hidden=true;btn.setAttribute('aria-expanded','false');}}
  btn.addEventListener('click',function(ev){
    ev.stopPropagation();
    if(pop.hidden){renderView();pop.hidden=false;btn.setAttribute('aria-expanded','true');positionPop();}
    else close();
  });
  document.addEventListener('pointerdown',function(ev){if(!pop.hidden&&!pop.contains(ev.target)&&ev.target!==btn)close();});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')close();});
  window.addEventListener('resize',function(){if(!pop.hidden)positionPop();});
}

  return h('button',{class:'btn small',type:'button',onclick:function(){loadPreset(k);}},PRESETS[k][0]);
}));
$('#themeBtn').addEventListener('click',function(){
  var i=THEMES.findIndex(function(t){return t[0]===S.theme;});
  S.theme=THEMES[(i+1)%THEMES.length][0];applyTheme();save();
});
$('#cls').value=S.cls;
$('#cls').addEventListener('input',function(){S.cls=this.value;renderLayers();update();});
$('#copyAll').addEventListener('click',function(){var a=SCOPE==='semua';copy(fullText(a),a?'Seluruh kode CSS tersalin':'Kode CSS elemen tersalin');});
$('#copyPage').addEventListener('click',function(){copy(fullPage(),'Halaman HTML + CSS tersalin');});
$('#dlPage').addEventListener('click',function(){download('desain-aplikasi.html',fullPage());});
function renderScope(){segBtns($('#scopeSeg'),[['pilih','Elemen ini'],['semua','Semua + HTML']],SCOPE,function(v){SCOPE=v;renderScope();renderCode();save();});}
var TYPE_LABEL={};TYPE_ORDER.forEach(function(k){TYPE_LABEL[k]=TYPES[k][0];});
function renderLayers(){
  var chips=h('div',{class:'chips',role:'group','aria-label':'Elemen di layar'},EL.map(function(e,i){
    return h('button',{class:'chip',type:'button','aria-pressed':String(i===SEL),onclick:function(){selectEl(i);}},e.s.cls||('elemen'+(i+1)));
  }));
  var add=h('select',{'aria-label':'Tambah elemen baru',onchange:function(){if(this.value)addEl(this.value);}},
    h('option',{value:''},'+ Tambah elemen'),TYPE_ORDER.map(function(k){return h('option',{value:k},TYPE_LABEL[k]);}));
  var bar=h('div',{class:'lbar'},add,
    h('button',{class:'btn small',type:'button','aria-label':'Pindah ke atas layar',disabled:SEL===0,onclick:function(){moveEl(-1);}},'\u2191'),
    h('button',{class:'btn small',type:'button','aria-label':'Pindah ke bawah layar',disabled:SEL===EL.length-1,onclick:function(){moveEl(1);}},'\u2193'),
    h('button',{class:'btn small',type:'button',onclick:dupEl},'Duplikat'),
    h('button',{class:'btn small',type:'button',disabled:EL.length<2,onclick:delEl},'Hapus'));
  fill($('#layers'),[chips,bar]);
}
$('#copyInline').addEventListener('click',function(){
  var s='style="'+build().filter(function(x){return x[0]!=='animation';}).map(function(x){return x[0]+': '+String(x[1]).replace(/"/g,"'")+';';}).join(' ')+'"';
  copy(s,'Atribut style tersalin');
});
function fitPhone(){
  var card=document.querySelector('.preview'),ph=$('#phone');if(!card||!ph)return;
  var bd=document.body,full=bd.classList.contains('full'),free=bd.classList.contains('free'),big=window.innerWidth>=960,k;
  if(free&&card.classList.contains('min'))return;
  if(full){
    var sh=big?0:$('.controls').offsetHeight;
    card.style.bottom=sh+'px';
    var aw=window.innerWidth-(big?400:0)-24-14,ah=window.innerHeight-sh-58-14;
    k=Math.max(.2,Math.min(aw/SW,ah/SH,2));
  }else if(free){
    card.style.bottom='';
    var g=card.querySelector('.grip'),hd=card.querySelector('.pv-head');
    var aw3=card.clientWidth-24-14,ah3=card.clientHeight-(g?g.offsetHeight:0)-(hd?hd.offsetHeight+8:0)-24-14;
    k=Math.max(.12,Math.min(aw3/SW,ah3/SH,2));
  }else{
    card.style.bottom='';
    var aw2=card.clientWidth-24-14,ah2=big?Math.min(window.innerHeight*0.5,560):window.innerHeight*0.38;
    k=Math.max(.2,Math.min(aw2/SW,(ah2-14)/SH,1));
  }
  k=+k.toFixed(3);
  if(k!==PK||ph.style.getPropertyValue('--k')===''){PK=k;ph.style.setProperty('--k',PK);}
  ph.style.setProperty('--sw',SW+'px');ph.style.setProperty('--sh',SH+'px');
  if(box)placeSel();
}
var usedFs=false;
function setFull(on){
  if(editing)stopEdit();
  document.body.classList.toggle('full',on);
  applyLayout();
  document.body.classList.toggle('open',on&&window.innerWidth>=960);
  $('#fullBtn').textContent=on?'Keluar layar penuh':'Layar penuh';
  $('#panelBtn').textContent=document.body.classList.contains('open')?'Tutup panel':'Pengaturan';
  try{
    if(on&&document.documentElement.requestFullscreen){var rq=document.documentElement.requestFullscreen();if(rq&&rq.then)rq.then(function(){usedFs=true;},function(){});}
    else if(!on&&document.fullscreenElement){usedFs=false;var ex=document.exitFullscreen();if(ex&&ex.catch)ex.catch(function(){});}
  }catch(x){}
  fitPhone();
}
$('#fullBtn').addEventListener('click',function(){setFull(!document.body.classList.contains('full'));});
$('#exitBtn').addEventListener('click',function(){setFull(false);});
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&usedFs&&document.body.classList.contains('full')){usedFs=false;setFull(false);}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&document.body.classList.contains('full')&&!editing)setFull(false);
});
$('#panelBtn').addEventListener('click',function(){
  var o=document.body.classList.toggle('open');
  this.textContent=o?'Tutup panel':'Pengaturan';fitPhone();
});
(function(){
  function mkb(t,fn){return h('button',{type:'button',onclick:fn},t);}
  fill($('#stb'),[mkb('Ubah teks',startEdit),mkb('Duplikat',dupEl),mkb('Hapus',delEl)]);
  $('#rsz').addEventListener('pointerdown',function(ev){
    if(!box)return;ev.stopPropagation();ev.preventDefault();
    var self=this,cs=getComputedStyle(box),o={x:ev.clientX,y:ev.clientY,w:parseFloat(cs.width)||box.offsetWidth,h:parseFloat(cs.height)||box.offsetHeight};
    try{self.setPointerCapture(ev.pointerId);}catch(x){}
    function mv(e){
      S.w={v:Math.max(8,Math.round(o.w+(e.clientX-o.x)/PK)),u:'px'};
      S.h={v:Math.max(8,Math.round(o.h+(e.clientY-o.y)/PK)),u:'px'};
      scheduleUpdate();
    }
    function up(){self.removeEventListener('pointermove',mv);self.removeEventListener('pointerup',up);self.removeEventListener('pointercancel',up);renderControls();update();}
    self.addEventListener('pointermove',mv);self.addEventListener('pointerup',up);self.addEventListener('pointercancel',up);
  });
  if(typeof ResizeObserver==='function')new ResizeObserver(function(){if(document.body.classList.contains('full'))fitPhone();}).observe($('.controls'));
})();
var lastW=window.innerWidth;
window.addEventListener('resize',function(){
  var ae=document.activeElement,typing=editing||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=='range');
  if(typing&&window.innerWidth===lastW)return;
  lastW=window.innerWidth;if(UI.free)clampAll();fitPhone();
});
initWindows();initView();applyDevice();applyLayout();
applyTheme();renderFmt();renderBg();renderScope();renderLayers();renderTabs();renderControls();fitPhone();update();
})();
